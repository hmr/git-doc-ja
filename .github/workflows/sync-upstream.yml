# 本家 (git/git) の master をこのフォークの master に取り込む。
#
# master にはこのワークフローのコミットが乗っているため、本家とは
# 早送りにならない。毎回 upstream/master を master にマージする。
#
# 本家の更新に .github/workflows/ の変更が含まれると、GITHUB_TOKEN
# では push できない。そのため Contents と Workflows の書き込み権限
# を持つ Personal Access Token を、リポジトリの secret SYNC_TOKEN に
# 登録しておくこと。
name: Sync upstream

on:
  schedule:
    - cron: '0 18 * * *'  # 毎日 03:00 JST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream

jobs:
  sync:
    if: github.repository == 'hmr/git-doc-ja'
    runs-on: ubuntu-latest
    steps:
      - name: check SYNC_TOKEN
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if test -z "$SYNC_TOKEN"
          then
            echo "::error::secret SYNC_TOKEN is not set"
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}
      - name: merge upstream/master
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/git/git.git
          git fetch --no-tags upstream master
          if git merge-base --is-ancestor upstream/master HEAD
          then
            echo "Already up to date."
            exit 0
          fi
          git merge --no-edit -m 'Merge upstream/master' upstream/master
          git push origin HEAD:master
